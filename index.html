<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>质因数分解器 · 判断质数 / 合数</title>
<meta name="description" content="输入 1 ~ 100000000 的整数，瞬间判断它是质数还是合数，并给出完整质因数分解式。">

<style>
  :root {
    --bg: #f4f5fa;
    --card: #ffffff;
    --ink: #171a26;
    --ink-2: #5d6478;
    --line: #e5e7f0;
    --accent: #4f46e5;
    --accent-2: #7c3aed;
    --prime: #047857;
    --prime-bg: #ecfdf5;
    --composite: #b45309;
    --composite-bg: #fffbeb;
    --none: #4b5563;
    --none-bg: #f3f4f6;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 12px 32px -12px rgba(16,24,40,.12);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1119;
      --card: #161a24;
      --ink: #e9ebf3;
      --ink-2: #98a0b6;
      --line: #262c3a;
      --accent: #818cf8;
      --accent-2: #a78bfa;
      --prime: #34d399;
      --prime-bg: rgba(52,211,153,.12);
      --composite: #fbbf24;
      --composite-bg: rgba(251,191,36,.12);
      --none: #9aa3b8;
      --none-bg: rgba(154,163,184,.12);
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,.12);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6);
    }
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    padding: 40px 20px 80px;
    min-height: 100vh;
  }

  main { max-width: 720px; margin: 0 auto; }

  header { margin-bottom: 28px; }

  h1 {
    font-size: clamp(26px, 5vw, 34px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  h1::before {
    content: "";
    width: 10px;
    height: 26px;
    border-radius: 3px;
    background: linear-gradient(160deg, var(--accent), var(--accent-2));
    flex: none;
  }

  .sub { margin: 0; color: var(--ink-2); font-size: 15px; }

  /* ---------- 输入区 ---------- */

  form { display: flex; gap: 12px; margin-top: 24px; }

  #num {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    padding: 15px 18px;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 12px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  #num::placeholder { color: var(--ink-2); opacity: .6; }

  #num:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent);
  }

  button[type="submit"] {
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    padding: 0 30px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(160deg, var(--accent), var(--accent-2));
    cursor: pointer;
    transition: transform .12s, filter .15s;
    white-space: nowrap;
  }

  button[type="submit"]:hover { filter: brightness(1.08); }
  button[type="submit"]:active { transform: scale(.97); }

  #examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
    align-items: center;
  }

  #examples .label { font-size: 13px; color: var(--ink-2); margin-right: 2px; }

  .chip {
    font: inherit;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }

  .chip:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- 结果卡 ---------- */

  #result { display: none; margin-top: 28px; }

  #result.show { display: block; animation: rise .25s ease-out; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 28px;
  }

  .badge {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .badge.prime     { color: var(--prime);     background: var(--prime-bg); }
  .badge.composite { color: var(--composite); background: var(--composite-bg); }
  .badge.none      { color: var(--none);      background: var(--none-bg); }

  .big {
    font-size: clamp(30px, 6vw, 42px);
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
    word-break: break-all;
  }

  .big sup { font-size: .52em; vertical-align: super; font-weight: 700; }

  /* 质数时只显示这两个字 */
  .verdict {
    font-size: clamp(44px, 9vw, 60px);
    font-weight: 800;
    letter-spacing: .06em;
    line-height: 1.15;
    color: var(--prime);
  }

  .note { margin-top: 10px; color: var(--ink-2); font-size: 14px; }

  /* ---------- 底部信息 ---------- */

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }

  .meta span::after { content: "·"; margin-left: 10px; opacity: .5; }
  .meta span:last-child::after { content: ""; margin: 0; }

  /* ---------- 错误提示 ---------- */

  .card.error {
    border-color: var(--danger);
    background: var(--danger-bg);
    color: var(--danger);
    font-size: 15px;
    font-weight: 600;
  }

  /* ---------- 模式切换 ---------- */

  .tabs {
    display: flex;
    gap: 6px;
    margin-top: 22px;
    padding: 5px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  .tab {
    flex: 1;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 10px 8px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
    transition: background .15s, color .15s;
  }

  .tab:hover { color: var(--ink); }

  .tab.active {
    color: #fff;
    background: linear-gradient(160deg, var(--accent), var(--accent-2));
  }

  .panel[hidden] { display: none; }

  .panel > .sub { margin: 18px 0 0; }

  /* ---------- 猜一猜 ---------- */

  .quiz-size {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
  }

  .quiz-size-label {
    font-size: 13px;
    color: var(--ink-2);
    margin-right: 2px;
  }

  .size-btn {
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }

  .size-btn:hover { color: var(--accent); border-color: var(--accent); }

  .size-btn.active {
    color: #fff;
    border-color: transparent;
    background: linear-gradient(160deg, var(--accent), var(--accent-2));
  }

  .quiz-card {
    margin-top: 22px;
    text-align: center;
  }

  .quiz-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
  }

  .quiz-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 14px 0 0;
  }

  .quiz-dots i {
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--line);
  }

  .quiz-dots i.correct { background: var(--prime); }
  .quiz-dots i.wrong { background: var(--danger); }
  .quiz-dots i.current { background: var(--accent); transform: scale(1.35); }

  .quiz-number {
    font-size: clamp(56px, 14vw, 84px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    margin: 20px 0 4px;
  }

  .quiz-question {
    font-size: 15px;
    color: var(--ink-2);
    margin: 0 0 22px;
  }

  .quiz-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .guess {
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 16px 0;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: transform .12s, border-color .15s, color .15s;
  }

  .guess:active { transform: scale(.97); }
  .guess.prime:hover { border-color: var(--prime); color: var(--prime); }
  .guess.composite:hover { border-color: var(--composite); color: var(--composite); }

  .feedback {
    margin-top: 24px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    animation: rise .2s ease-out;
  }

  .mark {
    font-size: 46px;
    font-weight: 800;
    line-height: 1;
  }

  .mark.good { color: var(--prime); }
  .mark.bad { color: var(--danger); }

  .mark-text {
    font-size: 17px;
    font-weight: 700;
    margin-top: 8px;
  }

  .mark-text.good { color: var(--prime); }
  .mark-text.bad { color: var(--danger); }

  .truth {
    margin: 12px 0 0;
    font-size: 16px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
    word-break: break-word;
  }

  .truth b {
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .truth sup {
    font-size: .6em;
    vertical-align: super;
    font-weight: 700;
  }

  .btn-next {
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    width: 100%;
    margin-top: 20px;
    padding: 14px 0;
    border: 0;
    border-radius: 12px;
    color: #fff;
    background: linear-gradient(160deg, var(--accent), var(--accent-2));
    cursor: pointer;
    transition: filter .15s, transform .12s;
  }

  .btn-next:hover { filter: brightness(1.08); }
  .btn-next:active { transform: scale(.98); }

  .score-big {
    font-size: clamp(60px, 15vw, 84px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    margin: 18px 0 6px;
  }

  .score-big span { font-size: .42em; font-weight: 700; margin-left: 2px; }
  .score-big.good { color: var(--prime); }
  .score-big.mid { color: var(--accent); }
  .score-big.bad { color: var(--danger); }

  .score-text { color: var(--ink-2); font-size: 15px; margin: 0; }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.8;
  }

  @media (max-width: 520px) {
    body { padding: 28px 16px 60px; }
    .card { padding: 22px 20px; }
    form { flex-direction: column; }
    button[type="submit"] { padding: 14px 0; }
  }

  /* 系统开启"减少动态效果"时，取消所有动画 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

<main>
  <header>
    <h1>质因数分解器</h1>
    <p class="sub">判断质数、分解质因数，或者来做一组小测试。</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="选择模式">
    <button class="tab active" type="button" data-mode="calc" role="tab" aria-selected="true">分解工具</button>
    <button class="tab" type="button" data-mode="quiz" role="tab" aria-selected="false">猜一猜</button>
  </nav>

  <section id="mode-calc" class="panel">
    <p class="sub">输入 1 ~ 100000000 的整数，立刻判断它是质数还是合数，并给出分解式。</p>

    <form id="form" autocomplete="off" novalidate>
      <input id="num" type="text" inputmode="numeric" placeholder="例如 360" aria-label="要分解的整数" autofocus>
      <button type="submit">分解</button>
    </form>

    <div id="examples">
      <span class="label">试试：</span>
    </div>

    <section id="result" aria-live="polite"></section>
  </section>

  <section id="mode-quiz" class="panel" hidden>
    <p class="sub">随机给出 100 ~ 10000 之间的奇数（不是 5 的倍数），猜猜它是质数还是合数。</p>

    <div class="quiz-size" aria-label="每组题数">
      <span class="quiz-size-label">每组题数</span>
      <button class="size-btn active" type="button" data-size="10" aria-pressed="true">10 题</button>
      <button class="size-btn" type="button" data-size="20" aria-pressed="false">20 题</button>
    </div>

    <section id="quiz" aria-live="polite"></section>
  </section>

  <footer>
    分解范围 1 ~ 100000000 &nbsp;|&nbsp; 预筛 10000 内质数（1229 个），试除分解<br>
    由 GitHub Pages 托管 · 纯前端，无需联网
  </footer>
</main>

<script>
(function () {
  "use strict";

  var MAX = 100000000;

  /* ============================================================
   * 1. 预处理：筛出 1 ~ √MAX（也就是 10000）以内的质数，共 1229 个
   *    只占几 KB。为什么不筛到 1 亿？那样要 400 MB 内存，页面根本打不开。
   * ============================================================ */
  var SQRT_MAX = Math.floor(Math.sqrt(MAX));   // 10000
  var primes = (function () {
    var composite = new Uint8Array(SQRT_MAX + 1);
    var list = [];
    for (var i = 2; i <= SQRT_MAX; i++) {
      if (composite[i]) continue;
      list.push(i);
      for (var j = i * i; j <= SQRT_MAX; j += i) composite[j] = 1;
    }
    return list;
  })();

  /* ============================================================
   * 2. 分解：用这张小质数表逐个试除
   *    任何 ≤ 1 亿的合数，必定有质因数 ≤ √n ≤ 10000，
   *    所以扫完整张表后仍没除尽的剩余部分，一定是质数。
   *    最坏情况（n 本身是大质数）也只需 1229 次除法，微秒级完成。
   * ============================================================ */
  function factorize(n) {
    var out = [];
    for (var i = 0; i < primes.length; i++) {
      var p = primes[i];
      if (p * p > n) break;            // 剩下的部分是质数，可以收工
      if (n % p !== 0) continue;
      var e = 0;
      do { n = n / p; e++; } while (n % p === 0);
      out.push([p, e]);
    }
    if (n > 1) out.push([n, 1]);       // 最后剩下的那个质因数
    return out;
  }

  /* ============================================================
   * 3. 把指数转成上标字符，如 3 → "³"
   * ============================================================ */
  var SUP = ["⁰","¹","²","³","⁴","⁵","⁶","⁷","⁸","⁹"];
  function superscript(e) {
    return String(e).split("").map(function (d) { return SUP[+d]; }).join("");
  }

  /* 把 [[2,3],[3,2],[5,1]] 变成 "2³ × 3² × 5" */
  function formatFactors(factors) {
    return factors.map(function (f) {
      return f[1] === 1 ? String(f[0]) : f[0] + superscript(f[1]);
    }).join(" × ");
  }

  /* ============================================================
   * 4. 渲染
   * ============================================================ */
  var resultEl = document.getElementById("result");

  function showError(msg) {
    resultEl.className = "show";
    resultEl.innerHTML = '<div class="card error">' + msg + "</div>";
  }

  function render(n) {
    var t0 = performance.now();
    var factors = factorize(n);
    var elapsed = performance.now() - t0;

    var isPrime = factors.length === 1 && factors[0][1] === 1;

    /* 分解快到计时器分辨率以下时，显示上限而不是 0.000 */
    var timeText = elapsed < 0.001
      ? "用时 &lt; 0.001 ms"
      : "用时 " + elapsed.toFixed(3) + " ms";

    var html = '<div class="card">';

    if (isPrime) {
      /* 质数只显示"质数"两个字 */
      html += '<div class="verdict">质数</div>';
    } else {
      html += '<span class="badge composite">合 数</span>';
      html += '<div class="big">' + n + " = " + formatFactors(factors) + "</div>";

      /* 约数个数 = ∏(指数 + 1) */
      var dcount = 1;
      for (var k = 0; k < factors.length; k++) dcount *= factors[k][1] + 1;

      html += '<div class="meta"><span>约数个数 ' + dcount + "</span>";
      html += "<span>不同质因数 " + factors.length + " 个</span>";
      html += "<span>" + timeText + "</span></div>";
    }

    html += "</div>";
    resultEl.className = "show";
    resultEl.innerHTML = html;
  }

  function renderOne() {
    resultEl.className = "show";
    resultEl.innerHTML =
      '<div class="card">' +
      '<span class="badge none">既非质数，也非合数</span>' +
      '<div class="big">1</div>' +
      '<p class="note">1 只有 1 个约数（它自己），按定义既不是质数也不是合数。</p>' +
      "</div>";
  }

  /* ============================================================
   * 5. 输入校验 + 提交
   * ============================================================ */
  var input = document.getElementById("num");

  function handle(raw) {
    var s = raw.trim().replace(/\s+/g, "");

    if (s === "") {
      return showError("请先输入一个整数。");
    }
    if (!/^\d+$/.test(s)) {
      return showError("只能输入数字：不支持小数点、负号、空格或其他字符。");
    }
    /* 去掉前导 0，避免 "0360" 这类写法 */
    s = s.replace(/^0+(?=\d)/, "");

    var n = Number(s);
    if (!Number.isSafeInteger(n)) {
      return showError("数字太大了，请输入 1 ~ 100000000 之间的整数。");
    }
    if (n < 1) {
      return showError("请输入正整数（1 或更大）。");
    }
    if (n > MAX) {
      return showError("超出范围：请输入 1 ~ 100000000 之间的整数。");
    }
    if (n === 1) {
      return renderOne();
    }
    render(n);
  }

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    handle(input.value);
  });

  input.addEventListener("focus", function () { input.select(); });

  /* 示例按钮 */
  var examples = [1, 2, 97, 360, 999983, 99999989, 100000000];
  var box = document.getElementById("examples");
  examples.forEach(function (n) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = n;
    b.addEventListener("click", function () {
      input.value = n;
      handle(String(n));
    });
    box.appendChild(b);
  });

  /* 支持带参数直接打开，例如 index.html#360，方便分享某个数的结果 */
  if (typeof location !== "undefined" && location.hash.length > 1) {
    try {
      var shared = decodeURIComponent(location.hash.slice(1)).trim();
      if (shared !== "") {
        input.value = shared;
        handle(shared);
      }
    } catch (err) { /* 分享参数格式异常时忽略即可 */ }
  }

  /* ============================================================
   * 6. 猜一猜：随机奇数（不含 5 的倍数），猜质数还是合数
   * ============================================================ */
  var QUIZ_LO = 101;            // 100 以上第一个奇数
  var QUIZ_HI = 9999;           // 10000 以内最后一个奇数
  var QUIZ_SIZES = [10, 20];    // 可选题数
  var quizSize = 10;

  var quizEl = document.getElementById("quiz");
  var quiz = null;

  /* 候选池：100 ~ 10000 之间、不是 5 的倍数的奇数 */
  var QUIZ_POOL = (function () {
    var list = [];
    for (var n = QUIZ_LO; n <= QUIZ_HI; n += 2) {
      if (n % 5 !== 0) list.push(n);
    }
    return list;
  })();

  /* 从候选池里不重复地随机取 k 个（部分洗牌，复杂度 O(k)） */
  function pickNumbers(k) {
    var pool = QUIZ_POOL.slice();
    for (var i = 0; i < k; i++) {
      var j = i + Math.floor(Math.random() * (pool.length - i));
      var tmp = pool[i];
      pool[i] = pool[j];
      pool[j] = tmp;
    }
    return pool.slice(0, k);
  }

  function isPrimeFactors(factors) {
    return factors.length === 1 && factors[0][1] === 1;
  }

  function newQuiz(size) {
    if (size === 10 || size === 20) quizSize = size;
    quiz = {
      numbers: pickNumbers(quizSize),
      total: quizSize,
      index: 0,
      correct: 0,
      answered: false,
      finished: false,
      results: [],
      lastCorrect: false
    };
    syncSizeButtons();
    renderQuiz();
  }

  /* 同步题数按钮的选中状态 */
  function syncSizeButtons() {
    var btns = document.querySelectorAll(".size-btn");
    for (var i = 0; i < btns.length; i++) {
      var on = Number(btns[i].getAttribute("data-size")) === quizSize;
      btns[i].classList.toggle("active", on);
      btns[i].setAttribute("aria-pressed", on ? "true" : "false");
    }
  }

  function answerQuiz(guess) {
    if (!quiz || quiz.answered || quiz.finished) return;
    var n = quiz.numbers[quiz.index];
    var truthIsPrime = isPrimeFactors(factorize(n));
    var saidPrime = guess === "prime";

    quiz.answered = true;
    quiz.lastCorrect = saidPrime === truthIsPrime;
    if (quiz.lastCorrect) quiz.correct++;
    quiz.results.push(quiz.lastCorrect);
    renderQuiz();
  }

  function nextQuiz() {
    if (!quiz || !quiz.answered || quiz.finished) return;
    if (quiz.index + 1 >= quiz.total) {
      quiz.finished = true;
    } else {
      quiz.index++;
      quiz.answered = false;
    }
    renderQuiz();
  }

  function dotsMarkup(results, current, total) {
    var s = '<div class="quiz-dots">';
    for (var i = 0; i < total; i++) {
      var cls = "";
      if (i < results.length) cls = results[i] ? "correct" : "wrong";
      else if (i === current) cls = "current";
      s += '<i class="' + cls + '"></i>';
    }
    return s + "</div>";
  }

  function renderQuiz() {
    if (!quiz) return;

    /* ---- 一组结束：给出正确率 ---- */
    if (quiz.finished) {
      var pct = Math.round((quiz.correct / quiz.total) * 100);
      var tone = pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad";
      var judge = pct >= 90 ? "太强了" : pct >= 70 ? "不错" : pct >= 50 ? "再练练" : "多来几组试试";

      quizEl.innerHTML =
        '<div class="card quiz-card">' +
          '<div class="quiz-head"><span>本组完成</span><span>共 ' + quiz.total + " 题</span></div>" +
          dotsMarkup(quiz.results, -1, quiz.total) +
          '<div class="score-big ' + tone + '">' + pct + "<span>%</span></div>" +
          '<p class="score-text">' + quiz.total + " 题答对 " + quiz.correct + " 题 · " + judge + "</p>" +
          '<button class="btn-next" data-again="1">再来一组</button>' +
        "</div>";
      return;
    }

    /* ---- 答题中 ---- */
    var n = quiz.numbers[quiz.index];
    var factors = factorize(n);
    var prime = isPrimeFactors(factors);

    var html = '<div class="card quiz-card">' +
      '<div class="quiz-head"><span>第 ' + (quiz.index + 1) + " / " + quiz.total + " 题</span>" +
      "<span>已答对 " + quiz.correct + " 题</span></div>" +
      dotsMarkup(quiz.results, quiz.answered ? -1 : quiz.index, quiz.total) +
      '<div class="quiz-number">' + n + "</div>" +
      '<p class="quiz-question">这是质数还是合数？</p>';

    if (!quiz.answered) {
      html += '<div class="quiz-actions">' +
        '<button class="guess prime" type="button" data-guess="prime">质数</button>' +
        '<button class="guess composite" type="button" data-guess="composite">合数</button>' +
        "</div>";
    } else {
      html += '<div class="feedback">';
      if (quiz.lastCorrect) {
        html += '<div class="mark good">✓</div><div class="mark-text good">答对了</div>';
      } else {
        html += '<div class="mark bad">✗</div><div class="mark-text bad">答错了</div>';
      }
      if (prime) {
        html += '<p class="truth">' + n + " 是<b>质数</b>，只能被 1 和它本身整除。</p>";
      } else {
        html += '<p class="truth">' + n + " 是<b>合数</b>：" + n + " = " + formatFactors(factors) + "</p>";
      }
      html += "</div>";
      html += '<button class="btn-next" type="button" data-next="1">' +
        (quiz.index + 1 >= quiz.total ? "看看本组正确率" : "下一题") + "</button>";
    }

    quizEl.innerHTML = html + "</div>";
  }

  /* 用事件委托，卡片重绘后不需要重新绑定 */
  quizEl.addEventListener("click", function (e) {
    var target = e.target;
    if (!target || !target.closest) return;
    if (target.closest("[data-guess]")) {
      answerQuiz(target.closest("[data-guess]").getAttribute("data-guess"));
    } else if (target.closest("[data-next]")) {
      nextQuiz();
    } else if (target.closest("[data-again]")) {
      newQuiz();
    }
  });

  /* ============================================================
   * 7. 模式切换
   * ============================================================ */
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));

  function setMode(mode) {
    tabs.forEach(function (t) {
      var on = t.getAttribute("data-mode") === mode;
      t.classList.toggle("active", on);
      t.setAttribute("aria-selected", on ? "true" : "false");
    });
    document.getElementById("mode-calc").hidden = mode !== "calc";
    document.getElementById("mode-quiz").hidden = mode !== "quiz";
  }

  tabs.forEach(function (t) {
    t.addEventListener("click", function () {
      setMode(t.getAttribute("data-mode"));
    });
  });

  /* 题数按钮：10 题 / 20 题 */
  var sizeBtns = Array.prototype.slice.call(document.querySelectorAll(".size-btn"));
  sizeBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      newQuiz(Number(btn.getAttribute("data-size")));
    });
  });

  newQuiz();

  /* 挂到全局，方便在浏览器控制台里直接调用（也便于自动化测试） */
  window.primeFactor = {
    MAX: MAX,
    factorize: factorize,
    formatFactors: formatFactors,
    render: render,
    handle: handle,
    setMode: setMode,
    quiz: {
      start: newQuiz,
      answer: answerQuiz,
      next: nextQuiz,
      state: function () { return quiz; },
      poolSize: QUIZ_POOL.length,
      sizes: QUIZ_SIZES
    }
  };
})();
</script>
